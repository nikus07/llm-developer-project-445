# Лимит: третья смена тарифа за сессию запрещена политикой (session_limit).
name: 90_session_limit
user: anna
turns:
  - say: переведи меня на семейный
    expect: { card: true }
  - say: да
    expect:
      reply_contains: ["отово"]
      state: { tariff: Семейный }
  - say: переведи меня на игровой
    expect: { card: true }
  - say: да
    expect:
      reply_contains: ["отово"]
      state: { tariff: Игровой }
  - say: переведи меня на базовый
    expect: { card: true }
  - say: да
    expect:
      reply_contains: ["лимит"]
      state: { tariff: Игровой }   # третья смена не исполнена
